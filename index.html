<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="데이터센터를 짓고 GPU와 전력을 확보해 경쟁 연구소보다 먼저 AGI에 도달하는 브라우저 게임" />

    <!--
      링크 미리보기 (카카오톡·슬랙·트위터 등에 주소를 붙여넣었을 때 뜨는 카드).
      og:image 와 og:url 은 반드시 전체 주소여야 합니다 — '/og.png' 같은 상대 주소는
      미리보기를 만드는 쪽에서 어느 사이트인지 알 수 없어 그림이 안 뜹니다.
      배포 주소가 바뀌면 아래 두 줄을 함께 고쳐야 합니다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AGI 경주" />
    <meta property="og:title" content="AGI 경주 — 먼저 AGI를 만드는 쪽이 이긴다" />
    <meta
      property="og:description"
      content="데이터센터를 짓고 GPU와 전력을 확보해 경쟁 연구소 세 곳보다 먼저 AGI에 도달하세요. 설치도 가입도 없이 한 판 약 20분."
    />
    <meta property="og:url" content="https://tepalmafia.github.io/my-web-game/" />
    <meta property="og:image" content="https://tepalmafia.github.io/my-web-game/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AGI 경주 — 네 연구소가 결승선을 향해 달리는 레이스 트랙" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 브라우저 탭 아이콘. 별도 파일 없이 주소 안에 그림을 직접 담았습니다 -->

    />
